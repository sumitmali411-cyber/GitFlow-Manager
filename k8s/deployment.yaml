apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitflow-manager
  namespace: gitflow-manager
  labels:
    app: gitflow-manager
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gitflow-manager
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: gitflow-manager
        version: "1.0.0"
    spec:
      containers:
        - name: gitflow-manager
          image: gitflow-manager:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              protocol: TCP
          envFrom:
            - configMapRef:
                name: gitflow-manager-config
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
      restartPolicy: Always
