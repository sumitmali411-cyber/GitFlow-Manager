# IMPORTANT: base64-encode each value before pasting here.
# Run:  echo -n "your-value" | base64
#
# Example:
#   echo -n "your-client-id" | base64
#   echo -n "your-client-secret" | base64
#   echo -n "$(openssl rand -hex 32)" | base64    # for SESSION_SECRET
#
# Then paste the output as the value below.
apiVersion: v1
kind: Secret
metadata:
  name: gitflow-manager-secrets
  namespace: gitflow-manager
type: Opaque
data:
  GITHUB_CLIENT_ID: ""       # base64(your_github_client_id)
  GITHUB_CLIENT_SECRET: ""   # base64(your_github_client_secret)
  SESSION_SECRET: ""         # base64(openssl rand -hex 32)
  SMTP_USER: ""              # base64(your_smtp_user) — optional
  SMTP_PASS: ""              # base64(your_smtp_password) — optional
  GEMINI_API_KEY: ""         # base64(your_gemini_api_key) — optional
