version: '3.8'

services:
  gitflow-manager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gitflow-manager-angular
    ports:
      - "80:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "com.gitflow.app=manager"
      - "com.gitflow.version=1.0.0"
      - "com.gitflow.framework=angular"
